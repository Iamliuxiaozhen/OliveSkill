<svg xmlns="http://www.w3.org/2000/svg" width="760" height="180" viewBox="0 0 760 180" role="img" aria-labelledby="title desc">
  <title id="title">Olive Skill on OpenClaw Marketplace</title>
  <desc id="desc">A marketplace card linking to the Olive Skill page on ClawHub.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101828"/>
      <stop offset="0.52" stop-color="#14213d"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="12" y="12" width="736" height="156" rx="22" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="12.5" y="12.5" width="735" height="155" rx="21.5" fill="none" stroke="#99f6e4" stroke-opacity="0.24"/>

  <g transform="translate(48 42)">
    <rect width="96" height="96" rx="24" fill="#ecfeff" fill-opacity="0.1" stroke="#ccfbf1" stroke-opacity="0.28"/>
    <path d="M54 19 25 55c-4 5-1 12 6 12h22l-8 23 30-37c4-5 0-12-6-12H47l7-22Z" fill="url(#mark)"/>
    <circle cx="31" cy="31" r="5" fill="#ccfbf1"/>
    <circle cx="67" cy="75" r="5" fill="#ccfbf1" opacity="0.9"/>
  </g>

  <g fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="176" y="64" font-size="17" font-weight="700" letter-spacing="1.8" fill="#99f6e4">OPENCLAW MARKETPLACE</text>
    <text x="176" y="105" font-size="38" font-weight="800">Olive Skill</text>
    <text x="176" y="134" font-size="17" fill="#dbeafe">Persona judgment model for evidence, risk, authority, OSS, and responsibility.</text>
  </g>

  <g transform="translate(596 66)">
    <rect width="112" height="48" rx="24" fill="#f8fafc"/>
    <text x="27" y="31" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="800">View</text>
    <path d="M74 18h13v13" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M86 19 70 35" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  </g>
