<svg xmlns="http://www.w3.org/2000/svg" width="760" height="180" viewBox="0 0 760 180" role="img" aria-labelledby="title desc">
  <title id="title">OliveSkill on OpenClaw Marketplace</title>
  <desc id="desc">A dark OpenClaw marketplace card with the OliveSkill lobster icon linking to ClawHub.</desc>
  <defs>
    <radialGradient id="cardGlow" cx="20%" cy="50%" r="65%">
      <stop offset="0" stop-color="#2a0707"/>
      <stop offset="0.48" stop-color="#171717"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d4d"/>
      <stop offset="0.55" stop-color="#f97316"/>
      <stop offset="1" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="lobsterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-35%" width="140%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="iconGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff4d4d" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#991b1b" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="12" y="12" width="736" height="156" rx="28" fill="url(#cardGlow)" filter="url(#softShadow)"/>
  <rect x="12.5" y="12.5" width="735" height="155" rx="27.5" fill="none" stroke="url(#border)" stroke-opacity="0.56"/>

  <g transform="translate(42 30)" filter="url(#iconGlow)">
    <rect x="-8" y="-8" width="136" height="136" rx="34" fill="#050810" stroke="#ff4d4d" stroke-opacity="0.24"/>
    <path d="M60 10 C30 10 15 35 15 55 C15 75 30 95 45 100 L45 110 L55 110 L55 100 C55 100 60 102 65 100 L65 110 L75 110 L75 100 C90 95 105 75 105 55 C105 35 90 10 60 10Z" fill="url(#lobsterGradient)"/>
    <path d="M20 45 C5 40 0 50 5 60 C10 70 20 65 25 55 C28 48 25 45 20 45Z" fill="url(#lobsterGradient)"/>
    <path d="M100 45 C115 40 120 50 115 60 C110 70 100 65 95 55 C92 48 95 45 100 45Z" fill="url(#lobsterGradient)"/>
    <path d="M45 15 Q35 5 30 8" stroke="#ff4d4d" stroke-width="3" stroke-linecap="round"/>
    <path d="M75 15 Q85 5 90 8" stroke="#ff4d4d" stroke-width="3" stroke-linecap="round"/>
    <circle cx="45" cy="35" r="6" fill="#050810"/>
    <circle cx="75" cy="35" r="6" fill="#050810"/>
    <circle cx="46" cy="34" r="2.5" fill="#00e5cc"/>
    <circle cx="76" cy="34" r="2.5" fill="#00e5cc"/>
  </g>

  <g fill="#fff7ed" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="190" y="75" font-size="16" font-weight="800" letter-spacing="1.9" fill="#ffb4a2">OPENCLAW MARKETPLACE</text>
    <text x="190" y="119" font-size="42" font-weight="850">OliveSkill</text>
  </g>

  <g transform="translate(596 66)">
    <rect width="112" height="48" rx="24" fill="#fff7ed"/>
    <text x="19" y="31" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="850">View Skill</text>
    <path d="M91 18h9v9" fill="none" stroke="#111827" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M99 19 87 31" fill="none" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
